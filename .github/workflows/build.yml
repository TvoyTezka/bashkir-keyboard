name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, verify and publish
        shell: pwsh
        run: ./build-release.ps1 -LoadTestLayout
      - uses: actions/upload-artifact@v7
        with:
          name: BashkortKeyboard-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 14
