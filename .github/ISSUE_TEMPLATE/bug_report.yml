name: Ошибка ввода
description: Некорректная замена, совместимость редактора или другая ошибка
title: "[Ошибка]: "
body:
  - type: input
    id: version
    attributes:
      label: Версия Башҡорт Keyboard
      placeholder: Например, 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows и редактор
      placeholder: Windows 11, Блокнот, стандартная RU-раскладка
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Используйте выдуманный текст. Не прикладывайте пароли и личные документы.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
